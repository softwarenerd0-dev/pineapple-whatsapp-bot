
name: Pineapple Bot Offline Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "test-all-commands.js"
      - "index.js"
      - "package.json"
      - "config.json"
      - ".github/workflows/test-bot.yml"

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run offline command tests
        run: node test-all-commands.js
